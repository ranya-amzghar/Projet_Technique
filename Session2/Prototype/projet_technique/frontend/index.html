<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-4">
    <button id="show" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">ajouter une section</button>
    <form id="form" hidden>
        <div class="px-6 py-6 max-w-md mx-6">
            <label for="">Nom</label>
            <input type="text" name="" id="nom" class="m-2 border border-gray-300 rounded-lg w-full p-2">
            <label for="">Description</label>
            <input type="text" name="" id="description" class="m-2 border border-gray-300 rounded-lg w-full p-2">
            <label for="">Couleur</label>
            <input type="color" id="color" class="m-2 border border-gray-300 rounded-lg w-full p-2">
            <label for="">Icone</label>
            <input type="text" id="icone" class="m-2 border border-gray-300 rounded-lg w-full p-2">
            <button type="submit" id="ajouter" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">ajouter</button>
            <button type="button" id="annuler" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">annuler</button>
        </div>
    </form>
    <table border="1" class="border border-gray-300 m-6">
        <thead class="border border-gray-300 m-6">
            <th class="border border-gray-300 px-4 py-2">Nom</th>
            <th class="border border-gray-300 px-4 py-2">Description</th>
            <th class="border border-gray-300 px-4 py-2">Couleur</th>
            <th class="border border-gray-300 px-4 py-2">Icone</th>
        </thead>
        <tbody id="table_body" class="border border-gray-300 m-6">

        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
